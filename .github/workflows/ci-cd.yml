name: CI-CD AnalyseProject

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Compilation, tests et Docker
    runs-on: ubuntu-latest
    steps:
      # Étape 1 : Récupération du code source
      - name: Récupération du code source
        uses: actions/checkout@v4

      # Étape 2 : Installation de Java 21
      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Étape 3 : Compilation et tests Maven
      - name: Compilation et tests Maven
        run: mvn -B -ntp clean verify

      # Étape 4 : Vérification du JAR
      - name: Vérification du JAR
        run: |
          ls -lh target/
          test -f target/AnalyseProjectFinal-0.0.1-SNAPSHOT.jar

      # Étape 5 : Sauvegarde du JAR
      - name: Sauvegarde du JAR
        uses: actions/upload-artifact@v4
        with:
          name: analyseproject-jar
          path: target/AnalyseProjectFinal-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

      # Étape 6 : Construction de l'image Docker
      - name: Construction de l'image Docker
        run: docker build -t analyse-project:1.0 .

      # Étape 7 : Démarrage du conteneur Docker
      - name: Démarrage du conteneur Docker
        run: |
          docker run -d \
            --name analyse-ci \
            -p 8089:8089 \
            analyse-project:1.0

      # Étape 8 : Vérification du service SOAP
      - name: Vérification du service SOAP
        run: |
          for i in $(seq 1 30); do
            if curl -fsS \
              "http://localhost:8089/analyzer?wsdl" \
              -o /tmp/analyzer.wsdl && \
              grep -qi "definitions" /tmp/analyzer.wsdl; then
              echo "Service SOAP accessible"
              exit 0
            fi
            sleep 2
          done
          echo "Service SOAP inaccessible"
          docker logs analyse-ci
          exit 1

      # Étape 9 : Arrêt du conteneur
      - name: Arrêt du conteneur
        if: always()
        run: docker rm -f analyse-ci || true